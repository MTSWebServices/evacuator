[build-system]
requires = [ "setuptools>=61.2", "setuptools-git-versioning>=3.0,<4"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true
version_file = "evacuator/VERSION"
count_commits_from_version_file = true
dev_template = "{tag}.dev{env:GITHUB_RUN_ID:{ccount}}+git.{sha}"
dirty_template = "{tag}.dev{env:GITHUB_RUN_ID:{ccount}}+git.{sha}.dirty"

[project]
name = "evacuator"
authors = [{name = "MWS Data Bridge", email = "onetools@mts.ru"}]
license = {text = "Apache-2.0"}
description = "Catch an exception and exit with an exit code"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.7"
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/MTSWebServices/evacuator"
Documentation = "https://evacuator.readthedocs.io"
Source = "https://github.com/MTSWebServices/evacuator"
"CI/CD" = "https://github.com/MTSWebServices/evacuator/actions"
Tracker = "https://github.com/MTSWebServices/evacuator/issues"

[project.entry-points."tricoder_package_spy.register"]
evacuator = "evacuator"

[tool.setuptools.packages.find]
include = ["evacuator*"]
exclude = ["docs", "tests"]

[tool.setuptools.package-data]
"*" = ["py.typed", "VERSION"]


[dependency-groups]
test = [
    "coverage>=7.2.7",
    "pytest>=7.4.4",
]
dev = [
    "mypy~=2.3.0",
    "prek~=0.4.12",
    "ruff~=0.16.1",
]
docs = [
    "furo~=2025.12.19",
    "numpydoc~=1.10.0",
    "packaging~=25.0",
    # sphinx-toolbox doesn't support Sphinx 9 yet
    "sphinx~=8.2.3",
    "sphinx-copybutton~=0.5.2",
    "sphinx-last-updated-by-git~=0.3.8",
    "sphinx-toolbox>=4.1,<4.4",
    "sphinxcontrib-towncrier~=0.5.0a0",
    "towncrier~=25.8.0",
]

[tool.uv]
default-groups = []

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.12"}
docs = {requires-python = ">=3.12"}

[tool.codespell]
ignore-words-list = "INOUT, inout"

[pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "evacuator"]
cache_dir = ".pytest_cache"
log_cli_level = "INFO"

[tool.coverage.run]
source_pkgs = ["evacuator"]
branch = true
parallel = true
relative_files = true
omit = [
  "tests/*",
]
data_file = "reports/.coverage"

[tool.coverage.report]
precision = 2
exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "class .*\bProtocol:",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",
  "def downgrade\\(\\)",
]
partial_also = [
  "if .*TYPE_CHECKING:",
  "if .*isEnabledFor.*:",
  "if .*debug.*:",
  "if .*sys.version_info.*:",
  "if __name__ == .__main__.:",
  "except .*ImportError",
]

[tool.ruff]
target-version = "py37"
line-length = 120
extend-exclude = ["docs/", "Makefile"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "ANN",
    "FIX002",
    "TD",
    "UP006",
    "UP007",
    "UP045",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S",
    "ANN",
    "D",
    "ARG",
    "DTZ",
    "EM101",
]

[tool.mypy]
python_version = 3.7
follow_imports = "silent"
ignore_missing_imports = true
pretty = true
show_error_codes = true
strict_optional = true

[tool.towncrier]
name = "Evacuator"
package = "evacuator"
filename = "docs/changelog/NEXT_RELEASE.rst"
directory = "docs/changelog/next_release/"
title_format = "{version} ({project_date})"
issue_format = ":github:pull:`{issue}`"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "significant"
name = "Significant Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "dependency"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Doc only Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true
